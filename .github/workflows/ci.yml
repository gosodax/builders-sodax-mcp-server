name: CI

on:
  push:
    branches:
      - master
      - development
  # Every base branch, so stacked PRs (based on another PR's branch) get CI too.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    timeout-minutes: 5
    runs-on: ubuntu-latest

    # The swap quote store's tests run against Redis as well as memory (#125). Pinned by digest.
    services:
      redis:
        image: redis:8.2.10-alpine@sha256:cead8b06d60a363832e64f5007101ae917fe8a77ec354dfb3be3655a2a351018
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: checkTS
        run: pnpm checkTs

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          REDIS_TEST_URL: redis://localhost:6379

      # Checks server.json with the live registry's validator (schema and semantic
      # rules). Publish can still fail on namespace auth or an existing version.
      - name: Validate server.json (MCP Registry)
        run: |
          .github/scripts/install-mcp-publisher.sh
          ./bin/mcp-publisher validate

  docker-build:
    name: Docker build
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the same Dockerfile Coolify deploys — both the `builder` and the
      # final prod stage. Catches prod-install / image regressions in CI instead
      # of at deploy time (#54). No push; GitHub Actions cache keeps warm runs fast.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
