[phases.setup]
# nodejs_22: required for the `--env-file-if-exists` flag in the start cmd below.
nixPkgs = ["nodejs_22"]

[phases.install]
# --ignore-scripts: no dependency lifecycle script runs during the deploy build.
# pnpm >=10 already blocks dependency build scripts (see allowBuilds in
# pnpm-workspace.yaml); this also skips the project's own husky `prepare` hook.
cmds = ["corepack enable", "corepack prepare pnpm@11.12.0 --activate", "pnpm install --frozen-lockfile --ignore-scripts"]

[phases.build]
cmds = ["pnpm build"]

[start]
# Load .env if present (Coolify normally injects env vars directly; the flag
# no-ops when no .env file exists, so this is safe either way).
cmd = "node --env-file-if-exists=.env dist/index.js"
