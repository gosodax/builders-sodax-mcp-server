name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master
          token: ${{ steps.app-token.outputs.token }}

  # Publishes server.json to the MCP Registry (registry.modelcontextprotocol.io)
  # for every release, so the registry and the directories that mirror it always
  # show the current version and tool list. Auth is GitHub OIDC: the
  # io.github.gosodax/* namespace is granted to workflows in the gosodax org,
  # no secrets needed.
  publish-mcp-registry:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install mcp-publisher
        run: .github/scripts/install-mcp-publisher.sh

      - name: Publish to the MCP Registry
        run: |
          ./bin/mcp-publisher login github-oidc
          ./bin/mcp-publisher publish
