name: New venue
description: Add a new liquidity venue (DEX, CEX, aggregator, intents network) in this repo.
title: "feat: add <venue> venue"
labels: [new-venue]
body:
  - type: markdown
    attributes:
      value: |
        One issue per repo. When a venue touches several repos, link the parent cross-repo issue and keep this one to this repo's part.
        Never paste API keys, account credentials or signer keys here.
  - type: input
    id: venue
    attributes:
      label: Venue
      description: Name and kind, e.g. "LI.FI (aggregator)".
    validations:
      required: true
  - type: input
    id: markets
    attributes:
      label: Chains and markets
      description: Which chains, pairs or assets it covers for us.
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Integration docs
      description: Link to the venue's API or contract docs.
  - type: textarea
    id: risk
    attributes:
      label: Limits and risk
      description: Fees, inventory or exposure caps, settlement time, how a failed or stuck fill is handled.
  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: The cross-repo issue or Epic this belongs to (owner/repo#N), if any.
  - type: textarea
    id: what
    attributes:
      label: What needs to be done
      description: What changes in this repo, e.g. an adapter, its registration, config, monitoring, dashboards.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ]
    validations:
      required: true
