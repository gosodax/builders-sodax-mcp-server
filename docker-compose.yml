services:
  builders-sodax-mcp-server:
    build: .
    container_name: builders-sodax-mcp-server
    env_file: .env
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT}
      - TRANSPORT=http
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
