name: New chain
description: Add support for a new chain in this repo.
title: "feat: add <chain> support"
labels: [new-chain]
body:
  - type: markdown
    attributes:
      value: |
        One issue per repo. When a chain touches several repos, link the parent cross-repo issue and keep this one to this repo's part.
        Never paste private keys, RPC credentials or unannounced contract addresses here.
  - type: input
    id: chain
    attributes:
      label: Chain
      description: Name and network, e.g. "Stacks mainnet".
    validations:
      required: true
  - type: input
    id: chain-type
    attributes:
      label: Chain type
      description: EVM, Solana, Sui, Stellar, ICON, Bitcoin, NEAR, Stacks...
    validations:
      required: true
  - type: input
    id: chain-ids
    attributes:
      label: Chain IDs
      description: The native chain ID and the SODAX relay chain ID, if one is assigned yet.
  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: The cross-repo issue or Epic this belongs to (owner/repo#N), if any.
  - type: textarea
    id: what
    attributes:
      label: What needs to be done
      description: What changes in this repo, e.g. config and constants, contracts, adapters or clients, UI, docs.
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: What must land first (contract deploys, relay support, an SDK release) and what waits on this.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ]
    validations:
      required: true
